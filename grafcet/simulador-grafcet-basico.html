<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador GRAFCET (Modo Local)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .local-status {
            background: #2196F3;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .local-status .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4CAF50;
            box-shadow: 0 0 8px #4CAF50;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 30px;
        }

        .grafcet-diagram {
            position: relative;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 40px;
            min-height: 600px;
        }

        .step {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px solid #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            background: white;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .step.active {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.6);
            transform: scale(1.1);
        }

        .step.initial {
            border-width: 6px;
        }

        .action {
            position: absolute;
            background: #2196F3;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            z-index: 5;
        }

        .transition {
            position: absolute;
            height: 3px;
            background: #333;
            z-index: 1;
        }

        .transition.vertical {
            width: 3px;
            height: auto;
        }

        .transition-label {
            position: absolute;
            background: white;
            padding: 5px 10px;
            border: 2px solid #333;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            z-index: 15;
            white-space: nowrap;
        }

        .transition-label.active {
            background: #FFC107;
            border-color: #FFC107;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .control-panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
        }

        .panel-section {
            margin-bottom: 25px;
        }

        .panel-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        .sensor-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 2px solid #333;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .sensor-btn:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }

        .sensor-btn:active {
            transform: translateY(0);
        }

        .sensor-btn.active {
            background: #FFC107;
            border-color: #FFC107;
            color: #333;
        }

        .sensor-btn.valid-next {
            border-color: #4CAF50;
            background: #e8f5e9;
        }

        .output-indicator {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: white;
            border: 2px solid #ddd;
        }

        .output-indicator .led {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ccc;
            margin-right: 10px;
            transition: all 0.3s ease;
        }

        .output-indicator.active .led {
            background: #4CAF50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.8);
        }

        .output-indicator .label {
            font-weight: bold;
            flex: 1;
        }

        .reset-btn {
            width: 100%;
            padding: 15px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            background: #d32f2f;
            transform: translateY(-2px);
        }

        .status-info {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
        }

        .status-info .current-step {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }

        .log-box {
            background: #1e1e1e;
            color: #00ff88;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border-radius: 8px;
            height: 110px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        /* Posicionamiento específico del GRAFCET */
        #step0 { top: 30px; left: 50%; transform: translateX(-50%); }
        #step1 { top: 180px; left: 50%; transform: translateX(-50%); }
        #step2 { top: 330px; left: 30%; transform: translateX(-50%); }
        #step3 { top: 330px; left: 70%; transform: translateX(-50%); }
        #step4 { top: 480px; left: 50%; transform: translateX(-50%); }

        #action0 { top: 30px; right: 20px; }
        #action1 { top: 180px; right: 20px; }
        #action2 { top: 330px; left: 10%; }
        #action3 { top: 330px; right: 10%; }
        #action4 { top: 480px; right: 20px; }

        .line0 { top: 90px; left: 50%; transform: translateX(-50%); width: 3px; height: 60px; }
        .line1a { top: 240px; left: 30%; width: 3px; height: 60px; }
        .line1b { top: 240px; left: 70%; width: 3px; height: 60px; }
        .line2 { top: 390px; left: 30%; width: 3px; height: 60px; }
        .line3 { top: 390px; left: 70%; width: 3px; height: 60px; }
        .line4a { top: 540px; left: 30%; height: 3px; width: calc(40% - 30px); }
        .line4b { top: 540px; left: 50%; height: 3px; width: calc(20%); }
        .line5 { top: 540px; left: 50%; transform: translateX(-50%); width: 3px; height: 60px; }
        .line6 { top: 600px; left: 50%; transform: translateX(-50%); width: 3px; height: 20px; }
        .line7 { top: 610px; left: 20%; height: 3px; width: 30%; }
        .line8 { top: 30px; left: 20%; width: 3px; height: 580px; }

        #trans0 { top: 120px; left: 55%; }
        #trans1a { top: 270px; left: 15%; }
        #trans1b { top: 270px; left: 75%; }
        #trans2 { top: 420px; left: 15%; }
        #trans3 { top: 420px; left: 75%; }
        #trans4 { top: 535px; left: 55%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Simulador GRAFCET Interactivo</h1>
        
        <div class="local-status">
            <div class="status-dot"></div>
            <span>Modo Simulación Local (Sin MQTT)</span>
        </div>

        <div class="main-layout">
            <div class="grafcet-diagram">
                <!-- Pasos -->
                <div id="step0" class="step initial">0</div>
                <div id="step1" class="step">1</div>
                <div id="step2" class="step">2</div>
                <div id="step3" class="step">3</div>
                <div id="step4" class="step">4</div>

                <!-- Acciones -->
                <div id="action0" class="action">Reposo</div>
                <div id="action1" class="action">Q1</div>
                <div id="action2" class="action">Q2</div>
                <div id="action3" class="action">Q3</div>
                <div id="action4" class="action">Q3</div>

                <!-- Líneas de transición -->
                <div class="transition vertical line0"></div>
                <div class="transition vertical line1a"></div>
                <div class="transition vertical line1b"></div>
                <div class="transition vertical line2"></div>
                <div class="transition vertical line3"></div>
                <div class="transition line4a"></div>
                <div class="transition line4b"></div>
                <div class="transition vertical line5"></div>
                <div class="transition vertical line6"></div>
                <div class="transition line7"></div>
                <div class="transition vertical line8"></div>

                <!-- Etiquetas de transición -->
                <div id="trans0" class="transition-label">M × X0</div>
                <div id="trans1a" class="transition-label">Fc1 × x1</div>
                <div id="trans1b" class="transition-label">Fc2 × x1</div>
                <div id="trans2" class="transition-label">Fc3 × x2</div>
                <div id="trans3" class="transition-label">Fc4 × x3</div>
                <div id="trans4" class="transition-label">Fc5 × x4</div>
            </div>

            <div class="control-panel">
                <div class="status-info">
                    <div>Estado Actual:</div>
                    <div class="current-step" id="currentStepDisplay">Paso 0</div>
                </div>

                <div class="panel-section">
                    <h3>Sensores (Pulsar para activar)</h3>
                    <button class="sensor-btn" data-sensor="M" data-value="X0">M × X0 (Inicio)</button>
                    <button class="sensor-btn" data-sensor="Fc1" data-value="x1">Fc1 × x1 (Rama Izq.)</button>
                    <button class="sensor-btn" data-sensor="Fc2" data-value="x1">Fc2 × x1 (Rama Der.)</button>
                    <button class="sensor-btn" data-sensor="Fc3" data-value="x2">Fc3 × x2</button>
                    <button class="sensor-btn" data-sensor="Fc4" data-value="x3">Fc4 × x3</button>
                    <button class="sensor-btn" data-sensor="Fc5" data-value="x4">Fc5 × x4 (Fin ciclo)</button>
                </div>

                <div class="panel-section">
                    <h3>Salidas</h3>
                    <div class="output-indicator" id="outputQ1">
                        <div class="led"></div>
                        <div class="label">Q1</div>
                    </div>
                    <div class="output-indicator" id="outputQ2">
                        <div class="led"></div>
                        <div class="label">Q2</div>
                    </div>
                    <div class="output-indicator" id="outputQ3">
                        <div class="led"></div>
                        <div class="label">Q3</div>
                    </div>
                </div>

                <div class="log-box" id="eventLog"></div>

                <button class="reset-btn" onclick="resetSystem()">🔄 Reset Sistema</button>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 0;
        let outputs = { Q1: false, Q2: false, Q3: false };

        function addLog(text) {
            const logBox = document.getElementById('eventLog');
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `<div>[${time}] ${text}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateDisplay() {
            // Actualizar pasos activos
            document.querySelectorAll('.step').forEach((step, index) => {
                step.classList.toggle('active', index === currentStep);
            });

            // Actualizar salidas
            document.getElementById('outputQ1').classList.toggle('active', outputs.Q1);
            document.getElementById('outputQ2').classList.toggle('active', outputs.Q2);
            document.getElementById('outputQ3').classList.toggle('active', outputs.Q3);

            // Actualizar display de paso actual
            document.getElementById('currentStepDisplay').textContent = `Paso ${currentStep}`;

            // Resaltar qué sensores son válidos en el paso actual
            const validMap = {
                0: ['M'],
                1: ['Fc1', 'Fc2'],
                2: ['Fc3'],
                3: ['Fc4'],
                4: ['Fc5']
            };
            const validSensors = validMap[currentStep] || [];
            document.querySelectorAll('.sensor-btn').forEach(btn => {
                const sensor = btn.getAttribute('data-sensor');
                btn.classList.toggle('valid-next', validSensors.includes(sensor));
            });
        }

        function processSensor(sensor, value) {
            let transitionLabel = null;
            let transitioned = false;

            switch (currentStep) {
                case 0:
                    if (sensor === "M" && value === "X0") {
                        currentStep = 1;
                        outputs = { Q1: true, Q2: false, Q3: false };
                        transitionLabel = document.getElementById('trans0');
                        transitioned = true;
                    }
                    break;
                case 1:
                    if (sensor === "Fc1" && value === "x1") {
                        currentStep = 2;
                        outputs = { Q1: false, Q2: true, Q3: false };
                        transitionLabel = document.getElementById('trans1a');
                        transitioned = true;
                    } else if (sensor === "Fc2" && value === "x1") {
                        currentStep = 3;
                        outputs = { Q1: false, Q2: false, Q3: true };
                        transitionLabel = document.getElementById('trans1b');
                        transitioned = true;
                    }
                    break;
                case 2:
                    if (sensor === "Fc3" && value === "x2") {
                        currentStep = 4;
                        outputs = { Q1: false, Q2: false, Q3: true };
                        transitionLabel = document.getElementById('trans2');
                        transitioned = true;
                    }
                    break;
                case 3:
                    if (sensor === "Fc4" && value === "x3") {
                        currentStep = 4;
                        outputs = { Q1: false, Q2: false, Q3: true };
                        transitionLabel = document.getElementById('trans3');
                        transitioned = true;
                    }
                    break;
                case 4:
                    if (sensor === "Fc5" && value === "x4") {
                        currentStep = 0;
                        outputs = { Q1: false, Q2: false, Q3: false };
                        transitionLabel = document.getElementById('trans4');
                        transitioned = true;
                    }
                    break;
            }

            if (transitioned) {
                addLog(`Transición -> Paso ${currentStep} (Q1:${+outputs.Q1} Q2:${+outputs.Q2} Q3:${+outputs.Q3})`);
                if (transitionLabel) {
                    transitionLabel.classList.add('active');
                    setTimeout(() => transitionLabel.classList.remove('active'), 500);
                }
            } else {
                addLog(`Sensor ${sensor} ignorado en Paso ${currentStep}`);
            }

            updateDisplay();
        }

        function resetSystem() {
            currentStep = 0;
            outputs = { Q1: false, Q2: false, Q3: false };
            addLog("Sistema reiniciado a Paso 0");
            updateDisplay();
        }

        // Event listeners para los botones de sensores
        document.querySelectorAll('.sensor-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const sensor = this.getAttribute('data-sensor');
                const value = this.getAttribute('data-value');
                
                this.classList.add('active');
                setTimeout(() => this.classList.remove('active'), 200);
                
                processSensor(sensor, value);
            });
        });

        // Inicializar
        updateDisplay();
        addLog("Simulador iniciado en Paso 0");
    </script>
</body>
</html>
