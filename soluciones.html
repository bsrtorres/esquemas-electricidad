<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soluciones</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #f6f4ef; --panel: #fff; --ink: #1d1d1f; --muted: #5d5d63; --accent: #b4471a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: Calibri, "Segoe UI", Arial, sans-serif; font-size: 19px; line-height: 1.5; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 32px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--panel); border-radius: 12px; padding: 20px; margin-bottom: 20px;
          box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input { font: inherit; padding: 8px 12px; border-radius: 8px; border: 2px solid var(--ink); min-width: 0; }
  button { font: inherit; padding: 8px 18px; border-radius: 8px; border: 2px solid var(--ink);
           background: var(--ink); color: #fff; cursor: pointer; font-weight: bold; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; vertical-align: top; }
  th { font-size: 16px; color: var(--muted); font-weight: normal; }
  td.n { width: 70px; font-weight: bold; }
  a { color: var(--accent); }
  #msg { margin: 12px 0 0; min-height: 1.5em; }
  .err { color: #b00020; font-weight: bold; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Soluciones</h1>
  <p class="lead">Zona del profesorado. <a href="./">Volver a los esquemas</a></p>

  <section class="card">
    <form id="f">
      <label for="k"><b>Clave:</b></label>
      <input id="k" type="password" autocomplete="current-password" required>
      <button>Entrar</button>
    </form>
    <p id="msg" role="status"></p>
  </section>

  <section class="card" id="list" hidden>
    <table>
      <thead><tr><th>N.º</th><th>Solución</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</div>
<script>
// Cada solución está cifrada (AES-256-GCM, clave derivada con PBKDF2-SHA256).
const SOL = [
  {n: "013", txt: "Telerruptor con tres pulsadores y 2 lámparas en paralelo",
   file: "sol/esquema-013-solucion.bin", name: "esquema-013-solucion.pdf"},
];
const ITER = 600000;
const msg = document.getElementById("msg");

async function decrypt(buf, pass) {
  const b = new Uint8Array(buf);
  if (new TextDecoder().decode(b.slice(0, 4)) !== "ESQ1") throw new Error("formato");
  const salt = b.slice(4, 20), iv = b.slice(20, 32), data = b.slice(32);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  return crypto.subtle.decrypt({name: "AES-GCM", iv}, key, data);
}

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pass = document.getElementById("k").value;
  msg.className = ""; msg.textContent = "Comprobando la clave…";
  try {
    const files = await Promise.all(SOL.map(s => fetch(s.file).then(r => {
      if (!r.ok) throw new Error("red"); return r.arrayBuffer();
    })));
    const pdfs = await Promise.all(files.map(f => decrypt(f, pass)));
    const rows = document.getElementById("rows");
    rows.innerHTML = "";
    SOL.forEach((s, i) => {
      const url = URL.createObjectURL(new Blob([pdfs[i]], {type: "application/pdf"}));
      const tr = document.createElement("tr");
      tr.innerHTML = `<td class="n"></td><td></td>`;
      const a = document.createElement("a");
      a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = s.n;
      const dl = document.createElement("a");
      dl.href = url; dl.download = s.name; dl.textContent = "descargar";
      tr.children[0].append(a);
      tr.children[1].append(s.txt + " · ", dl);
      rows.append(tr);
    });
    document.getElementById("list").hidden = false;
    msg.textContent = "Clave correcta.";
  } catch (err) {
    document.getElementById("list").hidden = true;
    msg.className = "err";
    msg.textContent = err.message === "red" ? "No se han podido cargar los archivos." : "Clave incorrecta.";
  }
});
</script>
</body>
</html>
