<style>
  :root { --navy: #0e1f3a; --navy2: #17335e; --volt: #ffc83d; --ink: #1d1d1f; }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { margin: 0; color: #fff; font-family: Calibri, "Segoe UI", Arial, sans-serif; font-size: 19px; line-height: 1.4;
         background:
           radial-gradient(circle at 15% 10%, rgba(255,200,61,.18), transparent 40%),
           radial-gradient(circle at 85% 90%, rgba(46,170,255,.20), transparent 45%),
           linear-gradient(160deg, var(--navy) 0%, var(--navy2) 100%);
         background-attachment: fixed;
         display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 16px; min-height: 100vh; }
  .logo { width: 64px; height: 64px; border-radius: 18px; background: var(--volt); color: var(--navy);
          display: grid; place-items: center; box-shadow: 0 0 0 6px rgba(255,200,61,.18), 0 8px 30px rgba(255,200,61,.35); margin-bottom: 18px; }
  .logo svg { width: 38px; height: 38px; fill: currentColor; }
  h1 { font-size: clamp(30px, 5vw, 46px); margin: 0; font-weight: 700; letter-spacing: -.01em; text-align: center; }
  h1 span { color: var(--volt); }
  p { color: #c5d2e6; margin: 8px 0 40px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 200px)); gap: 18px; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(3, minmax(0, 200px)); } }
  @media (max-width: 640px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; } }
  .grid a { --c: #2eaaff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
            aspect-ratio: 1; background: #fff; color: var(--ink); text-decoration: none; text-align: center; padding: 10px;
            border-radius: 20px; font-size: clamp(18px, 2.4vw, 22px); font-weight: 700;
            border-bottom: 6px solid var(--c); box-shadow: 0 4px 14px rgba(0,0,0,.25);
            transition: transform .15s, box-shadow .15s; }
  .grid a:hover, .grid a:focus-visible { transform: translateY(-4px); outline: none;
            box-shadow: 0 0 0 3px var(--c), 0 12px 30px rgba(0,0,0,.35); }
  .ico { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
         background: color-mix(in srgb, var(--c) 16%, #fff); color: var(--c); }
  .grid svg { width: 40px; height: 40px; stroke: currentColor; fill: none; stroke-width: 1.9;
              stroke-linecap: round; stroke-linejoin: round; }
  .grid a.c1 { --c: #7c4dff; } .grid a.c2 { --c: #e8590c; } .grid a.c3 { --c: #d6336c; } .grid a.c4 { --c: #0ca678; }
  .grid a.c5 { --c: #1c7ed6; } .grid a.c6 { --c: #e0a100; } .grid a.c7 { --c: #0b7285; } .grid a.c8 { --c: #5c677d; }
</style>
