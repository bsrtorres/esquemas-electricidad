<title>Esquemas de electricidad</title>
<style>
  :root { --bg: #f6f4ef; --panel: #fff; --ink: #1d1d1f; --muted: #6b6b72; --accent: #b4471a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: Calibri, "Segoe UI", Arial, sans-serif; font-size: 19px; line-height: 1.4;
         display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px; }
  h1 { font-size: clamp(30px, 5vw, 44px); margin: 0; font-weight: 700; letter-spacing: -.01em; text-align: center; }
  p { color: var(--muted); margin: 8px 0 40px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 220px)); gap: 20px; }
  @media (max-width: 760px) { .grid { grid-template-columns: repeat(2, minmax(0, 220px)); } }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
  .grid a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
            aspect-ratio: 1; background: var(--panel); color: var(--ink); text-decoration: none;
            border-radius: 20px; font-size: clamp(19px, 2.6vw, 24px); font-weight: 700;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); border: 2px solid transparent;
            transition: transform .15s, box-shadow .15s, border-color .15s; }
  .grid a:hover, .grid a:focus-visible { transform: translateY(-3px); border-color: var(--accent);
            box-shadow: 0 8px 24px rgba(0,0,0,.12); outline: none; color: var(--accent); }
  .grid svg { width: 56px; height: 56px; stroke: currentColor; fill: none; stroke-width: 1.8;
              stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
